<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Chibawa fan merchandise: official website">
<title>Chibawa: Official Website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@400;500;600&family=Playfair+Display:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #fffaff;
  --bg-soft: #f7f2ff;
  --ink: #514b7c;
  --muted: #928bb4;
  --navy: #7772b9;
  --card: #ffffff;
  --pink: #f8b9d5;
  --sky: #c4e5ff;
  --lilac: #d9ccff;
  --mint: #c9efdf;
  --butter: #ffe9ad;
  --peach: #ffd1bf;
  --shadow: 0 14px 38px rgba(112, 99, 164, .12);
  box-sizing: border-box;
  scroll-behavior: smooth;
}

*,
*::before,
*::after {
  box-sizing: inherit;
}

html {
  scroll-padding-top: 1rem;
}

body {
  min-width: 320px;
  margin: 0;
  overflow-x: hidden;
  color: var(--ink);
  font-family: "Fredoka", "Trebuchet MS", sans-serif;
  background:
    radial-gradient(ellipse at 8% 18%, rgba(248, 185, 213, .20), transparent 34rem),
    radial-gradient(ellipse at 92% 48%, rgba(196, 229, 255, .25), transparent 38rem),
    linear-gradient(180deg, #fffaff 0%, #faf7ff 48%, #f5f5ff 100%);
}

a {
  color: inherit;
}

a:focus-visible {
  outline: 3px solid var(--navy);
  outline-offset: 4px;
  border-radius: 12px;
}

.top {
  position: relative;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  width: min(100% - 2rem, 1100px);
  margin: 0 auto;
  padding: 1rem 0;
}

.brand {
  color: var(--navy);
  font: 800 1.55rem/1 "Baloo 2", sans-serif;
  text-decoration: none;
  letter-spacing: .01em;
}

.top nav {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: .55rem;
}

.top nav a {
  padding: .55rem 1rem;
  border: 1px solid rgba(217, 204, 255, .8);
  border-radius: 999px;
  background: rgba(255, 255, 255, .78);
  color: var(--ink);
  font-size: .95rem;
  font-weight: 500;
  text-decoration: none;
  transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
}

.top nav a:hover {
  transform: translateY(-2px);
  background: #fff;
  box-shadow: 0 5px 16px rgba(112, 99, 164, .10);
}

.hero {
  position: relative;
  isolation: isolate;
  display: flex;
  min-height: min(790px, 84svh);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 4rem 1.25rem 5rem;
  text-align: center;
  background:
    radial-gradient(ellipse at 14% 20%, rgba(248, 185, 213, .48), transparent 36%),
    radial-gradient(ellipse at 88% 24%, rgba(196, 229, 255, .62), transparent 38%),
    radial-gradient(ellipse at 28% 88%, rgba(201, 239, 223, .42), transparent 34%),
    radial-gradient(ellipse at 78% 92%, rgba(217, 204, 255, .55), transparent 38%);
}

.hero::before {
  position: absolute;
  z-index: -1;
  inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, .9) 1.5px, transparent 2px);
  background-size: 34px 34px;
  opacity: .48;
  content: "";
  pointer-events: none;
}

.hero::after {
  position: absolute;
  z-index: -1;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 28px;
  background: radial-gradient(circle at 14px 28px, rgba(255, 255, 255, .72) 14px, transparent 15px) 0 0 / 28px 28px repeat-x;
  content: "";
  pointer-events: none;
}

.hero > :not(.d):not(.pop) {
  position: relative;
  z-index: 1;
}

.logo {
  margin: 0;
  color: #fff;
  font: 800 clamp(3.6rem, 15vw, 8.5rem)/.95 "Baloo 2", sans-serif;
  letter-spacing: .015em;
  -webkit-text-stroke: .085em var(--navy);
  paint-order: stroke fill;
  text-shadow: 0 4px 0 rgba(119, 114, 185, .18), 0 0 24px rgba(255, 255, 255, .9);
}

.badge {
  display: block;
  width: min(76vw, 370px);
  height: auto;
  margin: .8rem 0 .35rem;
  filter: drop-shadow(0 12px 18px rgba(112, 99, 164, .14));
}

.pill {
  margin: .45rem 0 1.35rem;
  padding: .42rem 1.35rem;
  border: 2px solid rgba(255, 255, 255, .95);
  border-radius: 999px;
  background: linear-gradient(120deg, #8f89c9, #aaa1d8);
  color: #fff;
  font: 700 clamp(1.05rem, 4vw, 1.5rem)/1.25 "Baloo 2", sans-serif;
  letter-spacing: .045em;
  box-shadow: 0 5px 0 rgba(217, 204, 255, .9), 0 10px 24px rgba(119, 114, 185, .12);
}

.btn {
  display: inline-flex;
  min-height: 48px;
  align-items: center;
  justify-content: center;
  padding: .75rem 1.55rem;
  border: 1px solid rgba(255, 255, 255, .9);
  border-radius: 999px;
  background: linear-gradient(135deg, #ffc9df, #e4d8ff);
  color: #65558e;
  font-weight: 600;
  text-decoration: none;
  box-shadow: 0 5px 0 #dfb9dc, 0 10px 24px rgba(150, 130, 200, .12);
  transition: transform .2s ease, box-shadow .2s ease;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 0 #dfb9dc, 0 14px 28px rgba(150, 130, 200, .16);
}

.btn:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #dfb9dc;
}

.d {
  position: absolute !important;
  z-index: 0 !important;
  top: var(--y);
  left: var(--x);
  width: var(--s);
  color: var(--c);
  fill: currentColor;
  transform: rotate(var(--r, 0deg));
  animation: float 7s ease-in-out var(--d, 0s) infinite;
  pointer-events: none;
}

.d use[href="#spark"],
.d use[href="#star"] {
  filter: drop-shadow(0 0 5px rgba(255, 255, 255, .95));
}

.d:not(.cl):has(use[href="#spark"]),
.d:not(.cl):has(use[href="#star"]) {
  animation: float 7s ease-in-out var(--d, 0s) infinite, twinkle 2.8s ease-in-out var(--d, 0s) infinite;
}

.cl {
  opacity: .28;
  animation: drift 18s ease-in-out infinite alternate;
}

.pop {
  position: absolute !important;
  z-index: 0 !important;
  width: clamp(48px, 10vw, 88px);
  color: rgba(217, 204, 255, .75);
  pointer-events: none;
}

.pop.l { top: 12%; left: 6%; }
.pop.r { right: 6%; bottom: 14%; transform: scaleX(-1) rotate(180deg); }

.sec {
  position: relative;
  isolation: isolate;
  width: min(100% - 2rem, 1080px);
  margin: 2.5rem auto;
  padding: clamp(2.8rem, 7vw, 4.5rem) clamp(1rem, 4vw, 2.5rem);
  border: 1px solid rgba(217, 204, 255, .8);
  border-radius: clamp(24px, 4vw, 38px);
  background: rgba(255, 255, 255, .78);
  text-align: center;
  box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
}

.sec > :not(.d) {
  position: relative;
  z-index: 1;
}

.h2 {
  margin: 0 0 2.8rem;
  color: var(--navy);
  font: 800 clamp(2.8rem, 10vw, 5.3rem)/.95 "Baloo 2", sans-serif;
  letter-spacing: -.02em;
  text-shadow: 0 3px 0 rgba(196, 229, 255, .55);
}

.h2 span {
  display: block;
  -webkit-text-stroke: .035em rgba(255, 255, 255, .95);
  paint-order: stroke fill;
}

.h2 span:last-child {
  color: #9992bd;
}

.h2::after {
  display: block;
  width: min(210px, 58%);
  height: 7px;
  margin: 1.15rem auto 0;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--pink), var(--butter), var(--mint), var(--sky), var(--lilac));
  content: "";
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr));
  align-items: start;
  justify-items: center;
  gap: 2.6rem 1.5rem;
  max-width: 900px;
  margin: 0 auto;
  padding: 0;
  list-style: none;
}

.card {
  display: flex;
  width: 100%;
  flex-direction: column;
  align-items: center;
  gap: .9rem;
}

.orb {
  position: relative;
  width: min(100%, 190px);
  aspect-ratio: 1;
  transition: transform .28s cubic-bezier(.2, .8, .2, 1);
}

.card:hover .orb {
  transform: translateY(-6px) rotate(-2deg);
}

.orb::before {
  position: absolute;
  z-index: 0;
  inset: -7%;
  border-radius: 46% 54% 52% 48% / 48% 44% 56% 52%;
  background: var(--c, var(--lilac));
  opacity: .48;
  content: "";
  animation: spin 22s linear infinite;
}

.orb::after {
  position: absolute;
  z-index: 2;
  top: -8%;
  right: -7%;
  color: var(--c, var(--lilac));
  font-size: 1.45rem;
  text-shadow: 0 0 8px #fff, 1px 1px 0 #fff;
  content: "✦";
}

.card:nth-child(even) .orb::after {
  right: auto;
  left: -7%;
  content: "♡";
}

.card:nth-child(2) { --c: var(--mint); }
.card:nth-child(3) { --c: var(--pink); }
.card:nth-child(4) { --c: var(--butter); }
.card:nth-child(5) { --c: var(--sky); }

.disc {
  position: absolute;
  z-index: 1;
  inset: 0;
  overflow: hidden;
  border: 5px solid #fff;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 8px 24px rgba(112, 99, 164, .16);
}

.disc img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.name {
  margin: 0;
  padding: .35rem 1rem;
  border: 1px solid #f0e8ff;
  border-radius: 16px;
  background: #fff;
  color: var(--navy);
  font: 700 1.05rem "Baloo 2", sans-serif;
  box-shadow: 0 4px 14px rgba(150, 130, 200, .10);
}

.duo {
  position: relative;
  display: flex;
  justify-content: center;
  width: min(100%, 560px);
  margin: 1.8rem auto 0;
}

.ph {
  width: 52%;
  height: auto;
  filter: drop-shadow(0 10px 16px rgba(119, 114, 185, .18));
  animation: float 8s ease-in-out infinite;
}


.ph.p1 {
  margin-right: -4%;
  --r: 0deg;
  transform: rotate(0deg);
}

.ph.p2 {
  margin-left: -4%;
  --r: 0deg;
  transform: rotate(0deg);
  animation-delay: -4s;
}


.soon {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: clamp(4.5rem, 10vw, 7rem) 1rem;
  background:
    radial-gradient(ellipse at 15% 20%, rgba(217, 204, 255, .55), transparent 34%),
    radial-gradient(ellipse at 88% 70%, rgba(248, 185, 213, .42), transparent 36%),
    linear-gradient(180deg, transparent, rgba(241, 234, 255, .82), rgba(255, 240, 247, .9));
  text-align: center;
}

.soon .in {
  position: relative;
  z-index: 1;
  width: min(100%, 1000px);
  margin: 0 auto;
}

.more {
  margin: 0;
  color: transparent;
  font: 800 clamp(5rem, 23vw, 12rem)/.88 "Baloo 2", sans-serif;
  letter-spacing: .015em;
  -webkit-text-stroke: .035em var(--navy);
  text-shadow: .04em .05em 0 rgba(248, 185, 213, .75), .08em .09em 0 rgba(217, 204, 255, .7);
}

.cs {
  margin: -.08em 0 0;
  color: var(--navy);
  font: italic 800 clamp(2.8rem, 12vw, 7rem)/1 "Playfair Display", Georgia, serif;
  text-shadow: .025em .035em 0 rgba(196, 229, 255, .8);
}

footer {
  padding: 1.6rem 1rem 2.4rem;
  background: rgba(255, 255, 255, .62);
  color: var(--muted);
  font-size: .95rem;
  text-align: center;
}

footer svg {
  width: 1em;
  fill: var(--pink);
  vertical-align: -.12em;
}


@keyframes float {
  0%, 100% {
    transform: translateY(0) rotate(0deg);
  }
  50% {
    transform: translateY(-10px) rotate(0deg);
  }
}


@keyframes twinkle {
  0%, 100% { opacity: .48; filter: drop-shadow(0 0 2px #fff); }
  50% { opacity: 1; filter: drop-shadow(0 0 9px #fff); }
}

@keyframes drift {
  from { transform: translateX(-12px); }
  to { transform: translateX(18px); }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (min-width: 900px) {
  .duo {
    position: static;
    display: block;
    width: auto;
    margin: 0;
  }

  .duo .ph {
    position: absolute;
    z-index: 1;
    width: clamp(220px, 24vw, 340px);
    margin: 0;
  }

  .duo .p1 { top: 8%; right: 3%; }
  .duo .p2 { bottom: 4%; left: 3%; }
}

@media (max-width: 520px) {
  .top {
    width: min(100% - 1.25rem, 1100px);
  }

  .top nav {
    gap: .35rem;
  }

  .top nav a {
    padding: .48rem .72rem;
    font-size: .86rem;
  }

  .hero {
    min-height: 720px;
    min-height: 82svh;
    padding-inline: 1rem;
  }

  .sec {
    width: calc(100% - 1.25rem);
    padding-inline: 1rem;
  }

  .cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 2.3rem 1rem;
  }

  .card:last-child:nth-child(odd) {
    grid-column: 1 / -1;
  }

  .orb {
    width: min(38vw, 170px);
  }

  .pop {
    opacity: .6;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
  
/* PC PHOTO ALIGNMENT FIX */
@media (min-width: 900px) {
  .duo .ph {
    animation: none !important;
    transform: rotate(0deg) !important;
    rotate: 0deg !important;
  }
}

</style>
</head>
